<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kernel Cosmos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* One deliberate look: a quiet star system at night. */
  :root {
    color-scheme: dark;
    --deep: #04040E;
    --glass: rgba(12, 12, 34, 0.7);
    --glass-edge: rgba(180, 186, 255, 0.18);
    --text: #ECEEFA;
    --muted: #A3A8CC;
    --faint: #6D7299;
    --sun: #FFE7A8;
    --run: #9EF0B8;
    --sleep: #8FC3FF;
    --disk: #FFB38A;
    --zombie: #C9C2D6;
    --stop: #B7C4E0;
    --rt: #FF8A7A;
    --cache: #8FB8FF;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--deep); color: var(--text); font-family: var(--body); font-size: 14px; line-height: 1.5; }
  .tank { position: relative; height: 100%; min-height: 560px; overflow: hidden; background: linear-gradient(#120F33, #020309); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl.dragging { cursor: grabbing; }
  #gl.hovering { cursor: pointer; }

  .panel { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  code, .mono { font-family: var(--mono); }

  .title { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; padding: 10px 16px; max-width: min(340px, calc(100% - 32px)); pointer-events: none; }
  .title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 23px; letter-spacing: -0.01em; line-height: 1.1; }
  .title p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.4; }

  .tools { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 380px); }
  button { font-family: var(--body); font-weight: 600; font-size: 13px; color: var(--text); background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px; padding: 7px 13px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .2s, border-color .2s, color .2s; }
  button:hover:not(:disabled) { background: rgba(30, 30, 80, 0.85); border-color: rgba(180, 186, 255, 0.45); }
  button:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button[aria-pressed="true"] { border-color: var(--sun); color: var(--sun); }

  /* right column: process card / missions */
  .side { position: absolute; right: 16px; top: 64px; width: 336px; max-height: calc(100% - 150px); overflow-y: auto; padding: 16px; display: grid; gap: 12px; }
  .head { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; }
  .dot { width: 14px; height: 14px; border-radius: 50%; margin-top: 7px; box-shadow: 0 0 12px currentColor; background: currentColor; }
  .side h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.15; word-break: break-word; }
  .ids { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .close { padding: 3px 10px; font-size: 12px; }
  .state { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .pill { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .state span:last-child { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stats div { background: rgba(180, 186, 255, 0.07); border-radius: 8px; padding: 5px 8px; min-width: 0; }
  .stats b { display: block; font-family: var(--mono); font-weight: 500; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats span { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .about { margin: 0; color: #CFD2EC; font-size: 13.5px; }
  .side h3, .lens h4 { margin: 0 0 5px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .mono-list { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 11.5px; display: grid; gap: 2px; }
  .mono-list li { display: flex; justify-content: space-between; gap: 10px; }
  .mono-list li span:last-child { color: var(--faint); text-align: right; }
  .mono-list.fd li span { color: #D8DBF5; text-align: left; word-break: break-all; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { font-family: var(--mono); font-weight: 500; font-size: 11.5px; padding: 5px 10px; }
  .actions button.warn { border-color: rgba(255, 138, 122, .45); }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .cmds { display: grid; gap: 4px; }
  .cmd { display: block; width: 100%; text-align: left; font-family: var(--mono); font-weight: 400; font-size: 11.5px; color: #D8DBF5; background: rgba(0, 0, 0, .28); border: 1px solid rgba(180, 186, 255, .1); border-radius: 6px; padding: 5px 8px; white-space: nowrap; overflow-x: auto; backdrop-filter: none; }
  .cmd::before { content: "$ "; color: var(--faint); }

  /* missions */
  .mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mlist li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 7px 8px; border-radius: 8px; background: rgba(180, 186, 255, 0.05); }
  .mlist li.done { background: rgba(158, 240, 184, 0.07); }
  .mlist .ck { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--faint); margin-top: 2px; }
  .mlist li.done .ck { background: var(--run); border-color: var(--run); box-shadow: 0 0 8px rgba(158,240,184,.6); }
  .mlist b { font-weight: 600; font-size: 13.5px; display: block; }
  .mlist small { color: var(--muted); font-size: 12px; display: block; line-height: 1.4; }
  .mlist .learn { color: #CFE9D8; }

  /* left: lens panel */
  .lens { position: absolute; left: 16px; top: 118px; width: 330px; padding: 14px 16px; display: grid; gap: 10px; max-height: calc(100% - 190px); overflow-y: auto; }
  .lens h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; }
  .lens p { margin: 0; color: #C9CCE6; font-size: 12.8px; }
  .rq { display: grid; gap: 4px; font-family: var(--mono); font-size: 11.5px; }
  .rq .r { display: grid; grid-template-columns: 1fr 56px 46px; gap: 8px; align-items: center; }
  .rq .r .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: rgba(180,186,255,.12); border-radius: 3px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .rq .c { text-align: right; color: var(--sun); }
  .rq .c.w { color: var(--faint); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-family: var(--mono); font-size: 11.5px; }
  .kv span:nth-child(odd) { color: var(--faint); }
  table.t { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  table.t th { color: var(--faint); font-weight: 500; text-align: right; padding: 2px 4px; }
  table.t td { text-align: right; padding: 2px 4px; border-top: 1px solid rgba(180,186,255,.08); }
  table.t th:first-child, table.t td:first-child { text-align: left; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .dmesg { font-family: var(--mono); font-size: 11px; color: #E9C6B8; display: grid; gap: 2px; }
  .lens .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .lens .row button { font-size: 12px; padding: 6px 11px; }

  /* bottom bar */
  .bottom { position: absolute; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .htop { padding: 7px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); max-width: 100%; }
  .htop b { color: var(--text); font-weight: 500; }
  .dock { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; padding: 6px; }
  .dock button { font-size: 12.5px; padding: 6px 12px; }
  .dock .lbl { align-self: center; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); padding: 0 4px 0 6px; }
  .fact { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 32px)); text-align: center; padding: 9px 16px; font-size: 13.5px; color: #DADCF2; transition: opacity .9s ease; pointer-events: none; }
  .fact small { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--sun); margin-bottom: 2px; }
  .toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); width: min(460px, calc(100% - 32px)); padding: 12px 16px; display: grid; gap: 4px; border-color: rgba(158, 240, 184, .5); transition: opacity .5s ease, transform .5s ease; }
  .toast small { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--run); }
  .toast b { font-family: var(--display); font-size: 16px; }
  .toast span { color: #D3D6EE; font-size: 13px; }
  .tip { position: absolute; pointer-events: none; padding: 4px 9px; border-radius: 8px; font-family: var(--mono); font-size: 11.5px; background: rgba(6, 6, 20, 0.9); border: 1px solid var(--glass-edge); transform: translate(12px, -28px); white-space: nowrap; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  @media (max-width: 1100px) { .fact { display: none; } }
  @media (max-width: 900px) {
    .tools { max-width: calc(100% - 32px); top: auto; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); left: 16px; justify-content: center; }
    .title p { display: none; }
    .lens { top: 70px; width: auto; right: 16px; max-height: 38%; }
    .side { left: 16px; right: 16px; width: auto; top: auto; bottom: calc(160px + env(safe-area-inset-bottom, 0px)); max-height: 44%; }
    .dock { justify-content: center; width: 100%; }
    .dock .lbl { display: none; }
    .htop { font-size: 10px; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .fact, .toast { transition: none; } }
</style>
</head>
<body>

<div class="tank" id="tank">
  <canvas id="gl" aria-label="A 3D star system where planets are Linux processes"></canvas>

  <div class="title panel">
    <h1>Kernel Cosmos</h1>
    <p>Every planet is a Linux process and its moons are threads. Tap a planet, or open a lens below.</p>
  </div>

  <div class="tools">
    <button id="bSound" aria-pressed="false">Sound off</button>
    <button id="bFeed">Drop syscalls</button>
    <button id="bMissions" aria-pressed="false">Missions 0/16</button>
  </div>

  <aside class="side panel" id="card" hidden></aside>
  <aside class="side panel" id="missions" hidden></aside>
  <aside class="lens panel" id="lens" hidden></aside>

  <div class="fact panel" id="fact"><small>Did you know</small><span id="factText"></span></div>
  <div class="toast panel" id="toast" hidden><small>Mission complete</small><b id="toastT"></b><span id="toastB"></span></div>

  <div class="bottom">
    <div class="htop panel" id="htop"></div>
    <div class="dock panel" id="dock">
      <span class="lbl">Lenses</span>
      <button data-lens="sched" aria-pressed="false">Scheduler</button>
      <button data-lens="memory" aria-pressed="false">Memory</button>
      <button data-lens="cache" aria-pressed="false">Page cache</button>
      <button data-lens="irq" aria-pressed="false">Interrupts</button>
      <button data-lens="cgroups" aria-pressed="false">Cgroups</button>
      <button data-lens="conns" aria-pressed="false">Connections</button>
      <button data-lens="ns" aria-pressed="false">Namespaces</button>
    </div>
  </div>
  <div class="tip" id="tip" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const tankEl = $('tank'), canvas = $('gl');
  if (!window.THREE) { tankEl.insertAdjacentHTML('beforeend', '<div class="fallback">The 3D library could not load. Check your connection and reload.</div>'); return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch (e) { tankEl.insertAdjacentHTML('beforeend', '<div class="fallback">This browser has WebGL turned off, so the star system cannot render.</div>'); return; }

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const V3 = THREE.Vector3;
  const lin = c => new THREE.Color(c).convertSRGBToLinear();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // =====================================================================
  // Scene
  // =====================================================================
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  const scene = new THREE.Scene();
  {
    const c = document.createElement('canvas'); c.width = 4; c.height = 256;
    const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#120F33'); gr.addColorStop(0.5, '#070819'); gr.addColorStop(1, '#020309');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; scene.background = tex;
  }
  scene.fog = new THREE.FogExp2(lin(0x05061A), 0.006);
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 600);
  scene.add(new THREE.HemisphereLight(0xB8C4FF, 0x120A20, 0.32));
  const sun = new THREE.DirectionalLight(0xFFE2B8, 1.25); sun.position.set(-30, 14, 18); scene.add(sun);
  const rimLight = new THREE.DirectionalLight(0x6F7BFF, 0.35); rimLight.position.set(25, -6, -20); scene.add(rimLight);
  scene.add(new THREE.AmbientLight(0x1A1A3A, 0.4));

  const TW = 44, TD = 24, FLOOR = -11, SURF = 11;
  const ADD = THREE.AdditiveBlending;

  const softTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
    const r = g.createRadialGradient(64, 64, 4, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,0.8)'); r.addColorStop(0.3, 'rgba(255,255,255,0.25)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();

  // text sprites
  const texCache = new Map();
  function textTexture(text, color, weight = 500) {
    const key = text + color + weight; if (texCache.has(key)) return texCache.get(key);
    const c = document.createElement('canvas'), g = c.getContext('2d');
    g.font = `${weight} 30px "JetBrains Mono", ui-monospace, monospace`;
    const w = Math.ceil(g.measureText(text).width) + 24; c.width = w; c.height = 48;
    g.font = `${weight} 30px "JetBrains Mono", ui-monospace, monospace`;
    g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, 12, 25);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.minFilter = THREE.LinearFilter;
    const r = { t, aspect: w / 48 }; texCache.set(key, r); return r;
  }
  function textSprite(text, color, h = 0.7, weight = 500) {
    const { t, aspect } = textTexture(text, color, weight);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, fog: false }));
    s.scale.set(h * aspect, h, 1); return s;
  }
  function glowSprite(color, size, op) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: lin(color), transparent: true, opacity: op, blending: ADD, depthWrite: false, fog: false }));
    s.scale.setScalar(size); return s;
  }

  // stars + nebulae
  {
    const N = 2600, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const tints = [lin(0xFFFFFF), lin(0xCFD8FF), lin(0xFFE7C4), lin(0xB9C8FF)];
    for (let i = 0; i < N; i++) {
      const v = new V3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(rnd(160, 280));
      pos.set([v.x, v.y, v.z], i * 3);
      const t = pick(tints).clone().multiplyScalar(rnd(0.35, 1)); col.set([t.r, t.g, t.b], i * 3);
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.6, sizeAttenuation: false, vertexColors: true, fog: false, transparent: true, opacity: 0.95 })));
  }
  [[-120, 40, -170, 0x6B3FA0, 190], [140, -30, -150, 0x1F6F8B, 170], [20, 90, -220, 0x9B3F6B, 150], [-60, -80, 160, 0x2E4AA0, 200]].forEach(([x, y, z, c, sc]) => {
    const sp = glowSprite(c, sc, 0.32); sp.position.set(x, y, z); scene.add(sp);
  });

  // disk station
  const rocks = [];
  const rockMat = new THREE.MeshStandardMaterial({ color: lin(0x6A6272), roughness: 0.95, flatShading: true });
  const DISK = new V3(-15, -6.5, -5);
  {
    const core = new THREE.Mesh(new THREE.DodecahedronGeometry(2.2, 1), new THREE.MeshStandardMaterial({ color: lin(0x5C5566), roughness: 0.9, flatShading: true, emissive: lin(0xFF9A5C), emissiveIntensity: 0.06 }));
    core.position.copy(DISK); scene.add(core); rocks.push({ m: core, sp: new V3(0.05, 0.12, 0.03) });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.05, 8, 96), new THREE.MeshBasicMaterial({ color: lin(0xFFB38A), transparent: true, opacity: 0.55 }));
    ring.position.copy(DISK); ring.rotation.x = Math.PI / 2.3; scene.add(ring); rocks.push({ m: ring, sp: new V3(0, 0, 0.15) });
    const l = textSprite('/dev/nvme0n1 · disk', '#FFB38A', 0.95); l.position.set(DISK.x, DISK.y + 3.4, DISK.z); scene.add(l);
  }
  for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.25, 0.9), 0), rockMat);
    const a = rnd(0, 6.28), rr = rnd(24, 34);
    m.position.set(Math.cos(a) * rr, rnd(-9, 9), Math.sin(a) * rr * 0.7); m.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3)); m.scale.set(1.3, 0.85, 1);
    scene.add(m); rocks.push({ m, sp: new V3(rnd(-0.3, 0.3), rnd(-0.3, 0.3), rnd(-0.3, 0.3)) });
  }

  // page cache nebula
  const CACHE_POS = new V3(-9, -1, -9);
  const nebula = new THREE.Group(); nebula.position.copy(CACHE_POS); scene.add(nebula);
  const nebSprites = [[0, 0, 0, 0x8FB8FF], [1.2, 0.6, 0.4, 0xB08FFF], [-1, -0.4, 0.6, 0x7FD8FF], [0.3, -0.8, -0.8, 0x9FA8FF]].map(([x, y, z, c]) => { const s = glowSprite(c, 6, 0.3); s.position.set(x, y, z); nebula.add(s); return s; });
  const nebLabel = textSprite('page cache', '#8FB8FF', 0.7); scene.add(nebLabel);

  // NIC satellite
  const NIC = new V3(19, 2, -7);
  {
    const g = new THREE.Group(); g.position.copy(NIC); scene.add(g);
    const metal = new THREE.MeshStandardMaterial({ color: lin(0xB9BFD6), roughness: 0.5, metalness: 0.6 });
    const panel = new THREE.MeshStandardMaterial({ color: lin(0x2A3F8F), roughness: 0.4, metalness: 0.3, emissive: lin(0x1A2A6A), emissiveIntensity: 0.4 });
    g.add(new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.6), metal));
    for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.05, 1.1), panel); p.position.x = s * 2.1; g.add(p); }
    const dish = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.5, 20, 1, true), metal); dish.position.set(0, 0.9, 0); dish.rotation.x = Math.PI; g.add(dish);
    const blink = glowSprite(0x7FF0FF, 1.2, 0.8); blink.position.set(0, 0.2, 0.9); g.add(blink); g.userData.blink = blink;
    rocks.push({ m: g, sp: new V3(0, 0.1, 0) });
    const l = textSprite('eth0 · NIC', '#7FF0FF', 0.8); l.position.set(NIC.x, NIC.y + 2, NIC.z); scene.add(l);
    var nicBlink = blink;
  }

      after: () => { const b = lensEl.querySelector('[data-l="nsview"]'); if (b) b.textContent = nsInside ? 'Back to the host view' : 'View from inside the pod'; },
      cmds: ['lsns -p 2210', 'sudo nsenter -t 2210 -p -r ps aux', 'grep NSpid /proc/2210/status']
    }
  };
  function openLens(name) {
    lens = lens === name ? null : name;
    if (lens !== 'ns') nsInside = false;
    document.querySelectorAll('[data-lens]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lens === lens)));
    if (!lens) { lensEl.hidden = true; lensEl.innerHTML = ''; refreshCard(); return; }
    const L = LENS[lens];
    lensEl.innerHTML = `<h3>${L.title}</h3>${L.body()}<div data-live style="display:grid;gap:8px"></div>${cmdList(L.cmds)}`;
    lensEl.hidden = false;
    refreshLens(); refreshCard();
  }
  function refreshLens() {
    if (!lens) return;
    const L = LENS[lens];
    const live = lensEl.querySelector('[data-live]'); if (live) live.innerHTML = L.live();
    if (L.after) L.after();
  }
  document.getElementById('dock').addEventListener('click', e => { const b = e.target.closest('[data-lens]'); if (b) openLens(b.dataset.lens); });
  lensEl.addEventListener('click', e => {
    const b = e.target.closest('[data-l]'); if (!b || b.disabled) return;
    const a = b.dataset.l;
    if (a === 'leak') startLeak();
    else if (a === 'drop') { const d = MEM.cache; MEM.cache = 8; popup(`dropped ${Math.round(d - 8)}M of clean page cache`, '#8FB8FF', CACHE_POS.clone().add(new V3(0, 3, 0))); Sound.tick(); }
    else if (a === 'burst') { for (let i = 0; i < 12; i++) irq.queue.push(clock + i * 0.16); }
    else if (a === 'limit') {
      const cg = cgOf({ service: 'kubepods/checkout' });
      cg.quota = cg.quota === Infinity ? 0.5 : Infinity; cg.used = 0; cg.throttled = false;
      const m = procs.find(p => p.service === 'kubepods/checkout');
      if (m) popAt(m, cg.quota === Infinity ? 'cpu.max: max' : 'cpu.max: 50000 100000 (0.5 CPU)', '#FFE7A8');
    }
    else if (a === 'nsview') { nsInside = !nsInside; if (nsInside) complete('ns'); refreshCard(); }
    refreshLens();
  });

  // =====================================================================
  // HUD, facts, tools
  // =====================================================================
  function refreshHtop() {
    const live = procs.filter(p => p.state !== 'Z' || true);
    const tasks = live.length, thr = live.reduce((s, p) => s + p.thr, 0), running = procs.filter(p => p.state === 'R').length;
    const up = uptimeBase + clock, d = Math.floor(up / 86400), h = String(Math.floor(up % 86400 / 3600)).padStart(2, '0'), m = String(Math.floor(up % 3600 / 60)).padStart(2, '0');
    htopEl.innerHTML = `Tasks <b>${tasks}</b>, <b>${thr}</b> thr, <b>${running}</b> running · load <b>${load1.toFixed(2)}</b> ${load5.toFixed(2)} ${load15.toFixed(2)} · Mem <b>${Math.round(memUsed())}</b>/${RAM}M · cache ${Math.round(MEM.cache)}M · Swp ${Math.round(MEM.swapUsed)}/${SWAP}M · cs ${csRate.toFixed(0)}/s · up ${d}d ${h}:${m}`;
  }
  const FACTS = [
    'Most processes spend almost all their time asleep in state S, waiting for something to happen.',
    'Linux\'s CFS scheduler always runs the task with the smallest vruntime: the one that has had the least CPU so far.',
    'State D is uninterruptible sleep, usually waiting on disk. Even kill -9 has to wait until the I/O returns.',
    'After exit, a process stays a zombie until its parent calls wait(). It holds no memory, only an exit status and a PID.',
    'fork() does not copy memory. Parent and child share pages until one writes, and then only that page is copied.',
    'Threads share one address space, which is why they are moons of the same planet.',
    'Load average counts tasks that are running, waiting for a CPU, or stuck in state D.',
    'Low "free" memory on Linux is normal. The page cache hands memory back the moment programs need it.',
    'A major page fault reads from disk. A minor fault only fixes up a page table entry from RAM.',
    'Kubernetes CPU limits are cgroup cpu.max quotas. Hitting the quota means throttling, even when CPUs are idle.',
    'A container is just a process with its own namespaces. From the host you can see it with ps like any other.',
    'Orphaned processes are adopted by PID 1 (or the nearest subreaper), which reaps them when they exit.',
    'SIGKILL and SIGSTOP are the only signals a process cannot catch, block or ignore.',
    'Interrupt handlers do the minimum. Heavy work is deferred to softirqs, and to ksoftirqd when there is too much of it.'
  ];
  let factI = Math.floor(Math.random() * FACTS.length);
  const factEl = $('fact'), factText = $('factText');
  factText.textContent = FACTS[factI];
  setInterval(() => { factEl.style.opacity = 0; setTimeout(() => { factI = (factI + 1) % FACTS.length; factText.textContent = FACTS[factI]; factEl.style.opacity = 1; }, reduced ? 0 : 900); }, 14000);

  $('bSound').addEventListener('click', e => { const on = Sound.toggle(); e.currentTarget.textContent = on ? 'Sound on' : 'Sound off'; e.currentTarget.setAttribute('aria-pressed', on); });
  $('bFeed').addEventListener('click', () => {
    const live = procs.filter(p => p.state !== 'Z' && p.state !== 'T' && p.kind !== 'kernel' && !p.oomT);
    for (let i = 0; i < 6; i++) { const p = pick(live); if (p) dropPellet(p, pick(p.sys.filter(s => s !== 'clone').concat(['read'])), true); }
    Sound.bubble();
  });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') { select(null); if (lens) openLens(lens); missionsEl.hidden = true; } });

  // =====================================================================
  // Camera + input
  // =====================================================================
  const cam = { theta: 0.55, phi: 1.22, r: 46, target: new V3(0, -1, 0), goalR: 46 };
  const goal = new V3(0, -1, 0);
  let down = null, dragged = false, lastInteract = -99;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pickAt(cx, cy) {
    const r = canvas.getBoundingClientRect();
    ndc.set((cx - r.left) / r.width * 2 - 1, -(cy - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.proc : null;
  }
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, id: e.pointerId }; dragged = false; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (down && e.pointerId === down.id) {
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { dragged = true; canvas.classList.add('dragging'); }
      if (dragged) { cam.theta -= dx * 0.005; cam.phi = Math.max(0.45, Math.min(1.72, cam.phi - dy * 0.004)); down.x = e.clientX; down.y = e.clientY; lastInteract = clock; }
      tip.hidden = true; return;
    }
    if (e.pointerType !== 'mouse') return;
    const p = pickAt(e.clientX, e.clientY);
    canvas.classList.toggle('hovering', !!p);
    if (p) {
      const r = tankEl.getBoundingClientRect();
      const hidden = lens === 'ns' && nsInside && !p.ns;
      tip.textContent = hidden ? 'not visible from inside the pod' : `${p.comm} · ${shownPid(p)} · ${p.oomT ? 'OOM' : p.onCpu >= 0 ? 'on CPU' + p.onCpu : STATE_TXT[p.state][0]}`;
      tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.hidden = false;
    } else tip.hidden = true;
  });
  canvas.addEventListener('pointerup', e => {
    canvas.classList.remove('dragging');
    if (!down) return; const wasDrag = dragged; down = null;
    if (wasDrag) return;
    const p = pickAt(e.clientX, e.clientY);
    if (p) { select(p); lastInteract = clock; }
    else if (selected) select(null);
  });
  canvas.addEventListener('pointerleave', () => { tip.hidden = true; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); cam.goalR = Math.max(16, Math.min(70, cam.goalR * (1 + Math.sign(e.deltaY) * 0.08))); lastInteract = clock; }, { passive: false });

  function updateCamera(dt) {
    if (selected && !selected.dead) { goal.copy(posOf(selected)); cam.goalR = Math.min(cam.goalR, 26); }
    else goal.set(0, -1, 0);
    if (!reduced && !dragged && clock - lastInteract > 6) cam.theta += dt * 0.025;
    cam.target.lerp(goal, Math.min(1, dt * 1.6));
    cam.r += (cam.goalR - cam.r) * Math.min(1, dt * 2);
    if (!selected && cam.goalR < 34 && clock - lastInteract > 3) cam.goalR += (46 - cam.goalR) * Math.min(1, dt * 0.5);
    const sp = Math.sin(cam.phi);
    camera.position.set(cam.target.x + cam.r * sp * Math.sin(cam.theta), cam.target.y + cam.r * Math.cos(cam.phi), cam.target.z + cam.r * sp * Math.cos(cam.theta));
    camera.lookAt(cam.target);
  }
  function resize() {
    const w = tankEl.clientWidth, h = tankEl.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 64 : 48; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // =====================================================================
  // Boot
  // =====================================================================
  for (const d of PROCS_DEF) spawnProc(d);
  procs.forEach((p, i) => { if (i % 3 === 0) p.state = 'R'; });
  schedTick();
  resize();

  let last = performance.now(), uiT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    simulate(dt);
    movePlanets(dt, clock);
    updateBeams(dt);
    updateOverlays(dt, clock);
    animateScenery(dt, clock);
    updateCamera(dt);
    Sound.pad(dt);
    uiT += dt;
    if (uiT > 0.3) { uiT = 0; refreshCard(); refreshLens(); refreshHtop(); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__kc = { procs, openLens, select, startLeak, signal, forkProc, clockRef: () => clock, MEM, done, step: sec => { for (let i = 0; i < sec / 0.05; i++) { simulate(0.05); movePlanets(0.05, clock); updateBeams(0.05); updateOverlays(0.05, clock); } refreshCard(); refreshLens(); refreshHtop(); } };
})();
</script>
</body>
</html>
